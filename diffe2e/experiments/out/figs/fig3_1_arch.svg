</defs><text x="6.00" y="18.00" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400" transform="rotate(-90 6.00 18.00)">输入</text><text x="6.00" y="68.00" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400" transform="rotate(-90 6.00 68.00)">主链路：选择与生成</text><text x="6.00" y="123.00" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400" transform="rotate(-90 6.00 123.00)">仅评估</text><line x1="12.00" y1="30.50" x2="156.00" y2="30.50" stroke="#cccccc" stroke-width="0.2"/><line x1="12.00" y1="107.50" x2="156.00" y2="107.50" stroke="#cccccc" stroke-width="0.2"/><rect x="14.00" y="12.00" width="32.00" height="12.00" fill="none" stroke="#111111" stroke-width="0.3"/><text x="30.00" y="17.50" font-size="3.175" text-anchor="middle" fill="#111111" font-weight="400">V_old</text><text x="30.00" y="21.50" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">旧版本（覆盖基线）</text><rect x="50.00" y="12.00" width="32.00" height="12.00" fill="none" stroke="#111111" stroke-width="0.3"/><text x="66.00" y="17.50" font-size="3.175" text-anchor="middle" fill="#111111" font-weight="400">T</text><text x="66.00" y="21.50" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">既有 E2E 测试集</text><rect x="86.00" y="12.00" width="32.00" height="12.00" fill="none" stroke="#111111" stroke-width="0.3"/><text x="102.00" y="17.50" font-size="3.175" text-anchor="middle" fill="#111111" font-weight="400">diff</text><text x="102.00" y="21.50" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">本次代码变更</text><rect x="124.00" y="12.00" width="32.00" height="12.00" fill="none" stroke="#111111" stroke-width="0.3"/><text x="140.00" y="17.50" font-size="3.175" text-anchor="middle" fill="#111111" font-weight="400">V_new</text><text x="140.00" y="21.50" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">新版本</text><rect x="14.00" y="36.00" width="38.00" height="22.00" fill="none" stroke="#111111" stroke-width="0.3"/><text x="33.00" y="41.50" font-size="3.175" text-anchor="middle" fill="#111111" font-weight="400">映射器 M（二部图）</text><text x="33.00" y="45.50" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">dynamic 边：插桩证据</text><text x="33.00" y="49.10" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">ui 边：锚点匹配</text><text x="33.00" y="52.70" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">entityIndex：实体→测试</text><rect x="56.00" y="36.00" width="48.00" height="22.00" fill="none" stroke="#111111" stroke-width="0.3"/><text x="80.00" y="41.50" font-size="3.175" text-anchor="middle" fill="#111111" font-weight="400">diff 分析与 Semantic UI Diff</text><text x="80.00" y="45.50" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">Δ = 文件／函数／组件／路由</text><text x="80.00" y="49.10" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">UI 节点 {kind, key}</text><text x="80.00" y="52.70" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">→ ADD／REMOVE／MODIFY</text><rect x="108.00" y="36.00" width="38.00" height="22.00" fill="none" stroke="#111111" stroke-width="0.3"/><text x="127.00" y="41.50" font-size="3.175" text-anchor="middle" fill="#111111" font-weight="400">运行、分诊与轻量修复</text><text x="127.00" y="45.50" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">在 V_new 上运行 Sel</text><text x="127.00" y="49.10" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">通过 / 修复通过者</text><text x="127.00" y="52.70" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">→ targeted set</text><rect x="60.00" y="66.00" width="44.00" height="14.00" fill="none" stroke="#111111" stroke-width="0.3"/><text x="82.00" y="71.50" font-size="3.175" text-anchor="middle" fill="#111111" font-weight="400">在 M 上查询 Sel</text><text x="82.00" y="75.50" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">SelCov ∪ SelUI（只增不减）</text><rect x="108.00" y="66.00" width="38.00" height="14.00" fill="none" stroke="#111111" stroke-width="0.3"/><text x="127.00" y="71.50" font-size="3.175" text-anchor="middle" fill="#111111" font-weight="400">targeted set</text><text x="127.00" y="75.50" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">通过 / 修复通过者</text><rect x="60.00" y="88.00" width="44.00" height="14.00" fill="none" stroke="#111111" stroke-width="0.3"/><text x="82.00" y="93.50" font-size="3.175" text-anchor="middle" fill="#111111" font-weight="400">缺口分析与生成</text><text x="82.00" y="97.50" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">对 Δ 中未被 Sel 触达处</text><rect x="14.00" y="88.00" width="42.00" height="14.00" fill="none" stroke="#111111" stroke-width="0.3"/><text x="35.00" y="93.50" font-size="3.175" text-anchor="middle" fill="#111111" font-weight="400">新测试</text><text x="35.00" y="97.50" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">并入 T（跨提交演进）</text><line x1="30.00" y1="24.00" x2="30.00" y2="35.20" stroke="#111111" stroke-width="0.3"/><polygon points="30.00,36.00 29.05,33.80 30.95,33.80" fill="#111111" stroke="#111111" stroke-width="0.3"/><line x1="70.00" y1="24.00" x2="70.00" y2="27.50" stroke="#111111" stroke-width="0.3"/><line x1="70.00" y1="27.50" x2="48.00" y2="27.50" stroke="#111111" stroke-width="0.3"/><line x1="48.00" y1="27.50" x2="48.00" y2="35.20" stroke="#111111" stroke-width="0.3"/><polygon points="48.00,36.00 47.05,33.80 48.95,33.80" fill="#111111" stroke="#111111" stroke-width="0.3"/><line x1="97.00" y1="24.00" x2="97.00" y2="35.20" stroke="#111111" stroke-width="0.3"/><polygon points="97.00,36.00 96.05,33.80 97.95,33.80" fill="#111111" stroke="#111111" stroke-width="0.3"/><line x1="138.00" y1="24.00" x2="138.00" y2="35.20" stroke="#111111" stroke-width="0.3"/><polygon points="138.00,36.00 137.05,33.80 138.95,33.80" fill="#111111" stroke="#111111" stroke-width="0.3"/><line x1="152.00" y1="24.00" x2="152.00" y2="120.00" stroke="#111111" stroke-width="0.3" stroke-dasharray="1.4,1.0"/><line x1="152.00" y1="120.00" x2="146.80" y2="120.00" stroke="#111111" stroke-width="0.3" stroke-dasharray="1.4,1.0"/><polygon points="146.00,120.00 148.20,119.05 148.20,120.95" fill="#111111" stroke="#111111" stroke-width="0.3"/><text x="155.00" y="78.00" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400" transform="rotate(-90 155.00 78.00)">全量执行（仅评估）</text><line x1="35.00" y1="58.00" x2="35.00" y2="62.00" stroke="#111111" stroke-width="0.3"/><line x1="35.00" y1="62.00" x2="70.00" y2="62.00" stroke="#111111" stroke-width="0.3"/><line x1="70.00" y1="62.00" x2="70.00" y2="65.20" stroke="#111111" stroke-width="0.3"/><polygon points="70.00,66.00 69.05,63.80 70.95,63.80" fill="#111111" stroke="#111111" stroke-width="0.3"/><line x1="85.00" y1="58.00" x2="85.00" y2="65.20" stroke="#111111" stroke-width="0.3"/><polygon points="85.00,66.00 84.05,63.80 85.95,63.80" fill="#111111" stroke="#111111" stroke-width="0.3"/><line x1="104.00" y1="73.00" x2="107.20" y2="73.00" stroke="#111111" stroke-width="0.3"/><polygon points="108.00,73.00 105.80,73.95 105.80,72.05" fill="#111111" stroke="#111111" stroke-width="0.3"/><line x1="85.00" y1="80.00" x2="85.00" y2="87.20" stroke="#111111" stroke-width="0.3"/><polygon points="85.00,88.00 84.05,85.80 85.95,85.80" fill="#111111" stroke="#111111" stroke-width="0.3"/><text x="87.00" y="84.60" font-size="2.822" text-anchor="start" fill="#555555" font-weight="400">Sel 的覆盖边界</text><line x1="60.00" y1="95.00" x2="56.80" y2="95.00" stroke="#111111" stroke-width="0.3"/><polygon points="56.00,95.00 58.20,94.05 58.20,95.95" fill="#111111" stroke="#111111" stroke-width="0.3"/><line x1="14.00" y1="99.00" x2="10.50" y2="99.00" stroke="#111111" stroke-width="0.3"/><line x1="10.50" y1="99.00" x2="10.50" y2="6.00" stroke="#111111" stroke-width="0.3"/><line x1="10.50" y1="6.00" x2="66.00" y2="6.00" stroke="#111111" stroke-width="0.3"/><line x1="66.00" y1="6.00" x2="66.00" y2="11.20" stroke="#111111" stroke-width="0.3"/><polygon points="66.00,12.00 65.05,9.80 66.95,9.80" fill="#111111" stroke="#111111" stroke-width="0.3"/><text x="13.00" y="66.00" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400" transform="rotate(-90 13.00 66.00)">回填 T</text><rect x="14.00" y="114.00" width="132.00" height="18.00" fill="none" stroke="#111111" stroke-width="0.45" stroke-dasharray="1.6,1.0"/><text x="80.00" y="119.50" font-size="3.175" text-anchor="middle" fill="#111111" font-weight="400">评估 oracle（结果差异；§3.4）</text><text x="80.00" y="123.50" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">V_old／V_new 全量执行 → 比对 outcome(status, fingerprint)，得经验真值 A_obs</text><text x="80.00" y="127.10" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">A_obs 为 A* 的经验实例；仅用于评估，不参与选择／修复／生成（§3.1）</text><line x1="89.40" y1="114.00" x2="89.40" y2="104.00" stroke="#111111" stroke-width="0.5"/><line x1="90.60" y1="114.00" x2="90.60" y2="104.00" stroke="#111111" stroke-width="0.5"/><line x1="88.00" y1="107.80" x2="92.00" y2="111.80" stroke="#111111" stroke-width="0.5"/><line x1="88.00" y1="111.80" x2="92.00" y2="107.80" stroke="#111111" stroke-width="0.5"/><text x="94.00" y="110.00" font-size="2.822" text-anchor="start" fill="#111111" font-weight="400">禁止：评估结果不回流（§3.1）</text><text x="80.00" y="137.40" font-size="3.704" text-anchor="middle" fill="#111111" font-weight="400">图 3-1　DiffE2E 系统架构：组件与数据依赖（不含执行时序）</text><text x="80.00" y="141.40" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">实线＝数据依赖；虚线＝仅评估路径（V_new 全量执行）；双线＋✕＝禁止穿越的无泄漏边界（§3.1）。</text><text x="80.00" y="145.00" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">修复输入仅限旧（断裂）测试＋应用 old/new diff＋DOM/trace／候选元素；</text><text x="80.00" y="148.60" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">V_new 的测试文件与 new_locator 仅供评估，不进入修复输入或生成 prompt（L130）。</text><text x="80.00" y="152.20" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">三段分区沿用 §3.1 原词：输入／主链路“选择与生成”（L122）／仅评估（L130）；</text><text x="80.00" y="155.80" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">正文未定义分层名，故本图按组件—数据流绘制；评估侧统一称“评估 oracle”，经验真值为 A_obs（§3.4）。</text><text x="80.00" y="159.40" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">图内 entityIndex 为概念标注（反向索引），代码侧无同名变量；反查实际由 selector.mjs 的</text><text x="80.00" y="163.00" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">selectByCoverage 与 selectByUiLocator 线性扫描边集完成，不建持久索引（§4.2）。</text></g>
</svg>

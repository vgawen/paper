<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="160.0mm" height="142.0mm" viewBox="0 0 160.0 142.0" version="1.1">
<title>图 3-4 Semantic UI Diff</title>
<rect x="0" y="0" width="160.0" height="142.0" fill="#ffffff"/>
<g font-family="Noto Sans CJK SC, Source Han Sans SC, PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><defs>
<pattern id="hatch" width="1.4" height="1.4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<line x1="0" y1="0" x2="0" y2="1.4" stroke="#333333" stroke-width="0.3"/>
</pattern>
<pattern id="hatchL" width="2.2" height="2.2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<line x1="0" y1="0" x2="0" y2="2.2" stroke="#666666" stroke-width="0.2"/>
</pattern>
<pattern id="dotf" width="1.5" height="1.5" patternUnits="userSpaceOnUse">
<circle cx="0.55" cy="0.55" r="0.26" fill="#333333"/>
</pattern>
</defs><text x="4.00" y="7.00" font-size="2.999" text-anchor="start" fill="#111111" font-weight="400">输入：同一 UI 源文件新旧两版 V_old／V_new（JSX/TSX/HTML）；输出：节点级 ADD／REMOVE／MODIFY</text><text x="4.00" y="14.00" font-size="3.175" text-anchor="start" fill="#111111" font-weight="400">（a）抽取：源码 → 节点 {kind, key}</text><text x="5.00" y="20.50" font-size="2.822" text-anchor="start" fill="#555555" font-weight="400">kind</text><text x="20.00" y="20.50" font-size="2.822" text-anchor="start" fill="#555555" font-weight="400">来源（属性或事件信号）</text><line x1="4.00" y1="22.00" x2="76.00" y2="22.00" stroke="#111111" stroke-width="0.3"/><text x="5.00" y="28.00" font-size="2.999" text-anchor="start" fill="#111111" font-weight="400">text</text><text x="20.00" y="28.00" font-size="2.822" text-anchor="start" fill="#111111" font-weight="400">文本＋name/title/placeholder</text><text x="5.00" y="34.20" font-size="2.999" text-anchor="start" fill="#111111" font-weight="400">testId</text><text x="20.00" y="34.20" font-size="2.822" text-anchor="start" fill="#111111" font-weight="400">data-testid / testID</text><text x="5.00" y="40.40" font-size="2.999" text-anchor="start" fill="#111111" font-weight="400">role</text><text x="20.00" y="40.40" font-size="2.822" text-anchor="start" fill="#111111" font-weight="400">role</text><text x="5.00" y="46.60" font-size="2.999" text-anchor="start" fill="#111111" font-weight="400">aria</text><text x="20.00" y="46.60" font-size="2.822" text-anchor="start" fill="#111111" font-weight="400">aria-label</text><text x="5.00" y="52.80" font-size="2.999" text-anchor="start" fill="#111111" font-weight="400">href</text><text x="20.00" y="52.80" font-size="2.822" text-anchor="start" fill="#111111" font-weight="400">href</text><text x="5.00" y="59.00" font-size="2.999" text-anchor="start" fill="#111111" font-weight="400">handler</text><text x="20.00" y="59.00" font-size="2.822" text-anchor="start" fill="#111111" font-weight="400">onClick / onSubmit 处理函数名（非属性）</text><text x="4.00" y="68.00" font-size="2.822" text-anchor="start" fill="#555555" font-weight="400">六类 ↔ 八个锚点属性，双向可推、无悬空项（§3.3）</text><text x="80.00" y="14.00" font-size="3.175" text-anchor="start" fill="#111111" font-weight="400">（b）匹配与分类（按 key 两轮）</text><rect x="80.00" y="20.00" width="76.00" height="14.00" fill="none" stroke="#111111" stroke-width="0.3"/><text x="82.50" y="29.40" font-size="3.175" text-anchor="start" fill="#111111" font-weight="400">①</text><text x="88.00" y="26.20" font-size="2.999" text-anchor="start" fill="#111111" font-weight="400">精确 key 命中且字段有差异</text><text x="88.00" y="31.20" font-size="2.822" text-anchor="start" fill="#555555" font-weight="400">→ MODIFY（含字段级 changes）</text><rect x="80.00" y="38.00" width="76.00" height="14.00" fill="none" stroke="#111111" stroke-width="0.3"/><text x="82.50" y="47.40" font-size="3.175" text-anchor="start" fill="#111111" font-weight="400">②</text><text x="88.00" y="44.20" font-size="2.999" text-anchor="start" fill="#111111" font-weight="400">回退：同 tag 且（同 onClick 或同 testId）</text><text x="88.00" y="49.20" font-size="2.822" text-anchor="start" fill="#555555" font-weight="400">→ MODIFY（key 已变，按回退对）</text><rect x="80.00" y="56.00" width="76.00" height="14.00" fill="none" stroke="#111111" stroke-width="0.3"/><text x="82.50" y="65.40" font-size="3.175" text-anchor="start" fill="#111111" font-weight="400">③</text><text x="88.00" y="62.20" font-size="2.999" text-anchor="start" fill="#111111" font-weight="400">两轮都未命中</text><text x="88.00" y="67.20" font-size="2.822" text-anchor="start" fill="#555555" font-weight="400">→ 旧节点 REMOVE／新节点 ADD</text><rect x="4.00" y="78.00" width="49.00" height="36.00" fill="none" stroke="#111111" stroke-width="0.55"/><text x="6.00" y="84.20" font-size="3.175" text-anchor="start" fill="#111111" font-weight="400">例 A｜c08：REMOVE + ADD</text><text x="6.00" y="89.60" font-size="2.822" text-anchor="start" fill="#111111" font-weight="400">- data-testid="cart-add"</text><text x="6.00" y="93.90" font-size="2.822" text-anchor="start" fill="#111111" font-weight="400">+ data-testid="cart-add-btn"</text><text x="6.00" y="98.20" font-size="2.822" text-anchor="start" fill="#111111" font-weight="400">同 button；无 onClick</text><text x="6.00" y="102.50" font-size="2.822" text-anchor="start" fill="#111111" font-weight="400">testId 亦不同 → 回退不成立</text><text x="6.00" y="106.80" font-size="2.822" text-anchor="start" fill="#111111" font-weight="400">→ REMOVE + ADD</text><text x="6.00" y="111.10" font-size="2.822" text-anchor="start" fill="#111111" font-weight="400">ui 臂命中 cart.spec.ts</text><rect x="55.50" y="78.00" width="49.00" height="36.00" fill="none" stroke="#111111" stroke-width="0.3"/><text x="57.50" y="84.20" font-size="3.175" text-anchor="start" fill="#111111" font-weight="400">例 B｜C1：MODIFY</text><text x="57.50" y="89.60" font-size="2.822" text-anchor="start" fill="#111111" font-weight="400">- href="https://reactjs.org"</text><text x="57.50" y="93.90" font-size="2.822" text-anchor="start" fill="#111111" font-weight="400">+ href="https://react.dev"</text><text x="57.50" y="98.20" font-size="2.822" text-anchor="start" fill="#111111" font-weight="400">key 不变：a:text:Learn React</text><text x="57.50" y="102.50" font-size="2.822" text-anchor="start" fill="#111111" font-weight="400">→ MODIFY（changes: href）</text><text x="57.50" y="106.80" font-size="2.822" text-anchor="start" fill="#111111" font-weight="400">修复：断言字段更新</text><rect x="107.00" y="78.00" width="49.00" height="36.00" fill="none" stroke="#111111" stroke-width="0.3"/><text x="109.00" y="84.20" font-size="3.175" text-anchor="start" fill="#111111" font-weight="400">例 C｜C1：REMOVE + ADD</text><text x="109.00" y="89.60" font-size="2.822" text-anchor="start" fill="#111111" font-weight="400">- text: "Red"</text><text x="109.00" y="93.90" font-size="2.822" text-anchor="start" fill="#111111" font-weight="400">+ text: "Crimson"</text><text x="109.00" y="98.20" font-size="2.822" text-anchor="start" fill="#111111" font-weight="400">无 testId／onClick</text><text x="109.00" y="102.50" font-size="2.822" text-anchor="start" fill="#111111" font-weight="400">→ 回退不成立</text><text x="109.00" y="106.80" font-size="2.822" text-anchor="start" fill="#111111" font-weight="400">→ REMOVE + ADD（非 MODIFY）</text><text x="109.00" y="111.10" font-size="2.822" text-anchor="start" fill="#111111" font-weight="400">修复：locator Red→Crimson</text><text x="80.00" y="125.20" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">例 A 取自受控主体 c07→c08 的 src/cart.js：c08 是依据 seed.mjs 单处替换（testid 字面量）的确定性复原，</text><text x="80.00" y="128.60" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">受控主体为运行时构造、工作树未归档，故该例不是 git diff 打印件。</text><text x="80.00" y="132.00" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">例 B、例 C 取自 §5.5 的 C1 真实 JSX（App.old→App.new，out/c1_loop.md）；</text><text x="80.00" y="135.40" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">C1 中另有回退匹配的 MODIFY 实例 testid:turquoise-btn{testId}（同 button、同 onClick）。</text><text x="80.00" y="138.80" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">−／+ 分别表示旧、新版本行；本图为机制示意，不含实验数字。</text></g>
</svg>

</defs><text x="6.00" y="10.50" font-size="3.351" text-anchor="start" fill="#111111" font-weight="400">（a）池量与等额抽样（每仓 10 条）</text><rect x="6.00" y="14.30" width="2.40" height="2.40" fill="#111111" stroke="#111111" stroke-width="0.3"/><text x="9.60" y="16.30" font-size="2.822" text-anchor="start" fill="#111111" font-weight="400">每仓等额抽样 10 条</text><rect x="44.00" y="14.30" width="2.40" height="2.40" fill="#e8e8e8" stroke="#111111" stroke-width="0.2"/><text x="47.60" y="16.30" font-size="2.822" text-anchor="start" fill="#111111" font-weight="400">池量 n</text><text x="156.00" y="16.30" font-size="2.822" text-anchor="end" fill="#555555" font-weight="400">抽样比</text><text x="55.00" y="24.70" font-size="2.999" text-anchor="end" fill="#111111" font-weight="400">ghiscoding/angular-slickgrid</text><rect x="58.00" y="20.50" width="78.00" height="5.80" fill="#e8e8e8" stroke="#111111" stroke-width="0.25"/><rect x="58.00" y="20.50" width="3.18" height="5.80" fill="#111111" stroke="#111111" stroke-width="0.25"/><text x="134.50" y="24.60" font-size="2.822" text-anchor="end" fill="#111111" font-weight="400">245</text><text x="156.00" y="24.60" font-size="2.999" text-anchor="end" fill="#111111" font-weight="400">4.1%</text><text x="55.00" y="33.70" font-size="2.999" text-anchor="end" fill="#111111" font-weight="400">tryghost/koenig</text><rect x="58.00" y="29.50" width="24.83" height="5.80" fill="#e8e8e8" stroke="#111111" stroke-width="0.25"/><rect x="58.00" y="29.50" width="3.18" height="5.80" fill="#111111" stroke="#111111" stroke-width="0.25"/><text x="81.33" y="33.60" font-size="2.822" text-anchor="end" fill="#111111" font-weight="400">78</text><text x="156.00" y="33.60" font-size="2.999" text-anchor="end" fill="#111111" font-weight="400">12.8%</text><text x="55.00" y="42.70" font-size="2.999" text-anchor="end" fill="#111111" font-weight="400">nasa/openmct</text><rect x="58.00" y="38.50" width="14.64" height="5.80" fill="#e8e8e8" stroke="#111111" stroke-width="0.25"/><rect x="58.00" y="38.50" width="3.18" height="5.80" fill="#111111" stroke="#111111" stroke-width="0.25"/><text x="71.14" y="42.60" font-size="2.822" text-anchor="end" fill="#111111" font-weight="400">46</text><text x="156.00" y="42.60" font-size="2.999" text-anchor="end" fill="#111111" font-weight="400">21.7%</text><text x="55.00" y="51.70" font-size="2.999" text-anchor="end" fill="#111111" font-weight="400">microsoft/playwright</text><rect x="58.00" y="47.50" width="14.33" height="5.80" fill="#e8e8e8" stroke="#111111" stroke-width="0.25"/><rect x="58.00" y="47.50" width="3.18" height="5.80" fill="#111111" stroke="#111111" stroke-width="0.25"/><text x="70.83" y="51.60" font-size="2.822" text-anchor="end" fill="#111111" font-weight="400">45</text><text x="156.00" y="51.60" font-size="2.999" text-anchor="end" fill="#111111" font-weight="400">22.2%</text><text x="58.00" y="58.50" font-size="2.822" text-anchor="start" fill="#555555" font-weight="400">池量 n：414 条无泄漏样本之和 = 245 + 78 + 46 + 45</text><text x="6.00" y="68.00" font-size="3.351" text-anchor="start" fill="#111111" font-weight="400">（b）少数类（修复成功）命中数</text><text x="58.00" y="74.00" font-size="2.999" text-anchor="start" fill="#111111" font-weight="400">■ 规则臂</text><text x="80.00" y="74.00" font-size="2.999" text-anchor="start" fill="#111111" font-weight="400">▲ LLM 臂</text><text x="136.00" y="74.00" font-size="2.822" text-anchor="end" fill="#555555" font-weight="400">分母 = 每仓 10 条</text><line x1="58.00" y1="77.00" x2="58.00" y2="112.00" stroke="#cccccc" stroke-width="0.25" stroke-dasharray="1 1"/><text x="58.00" y="115.60" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">0</text><line x1="84.00" y1="77.00" x2="84.00" y2="112.00" stroke="#cccccc" stroke-width="0.25" stroke-dasharray="1 1"/><text x="84.00" y="115.60" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">5</text><line x1="110.00" y1="77.00" x2="110.00" y2="112.00" stroke="#cccccc" stroke-width="0.25" stroke-dasharray="1 1"/><text x="110.00" y="115.60" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">10</text><line x1="136.00" y1="77.00" x2="136.00" y2="112.00" stroke="#cccccc" stroke-width="0.25" stroke-dasharray="1 1"/><text x="136.00" y="115.60" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">15</text><text x="55.00" y="83.00" font-size="2.999" text-anchor="end" fill="#111111" font-weight="400">ghiscoding/angular-slickgrid</text><rect x="56.70" y="78.40" width="2.60" height="2.20" fill="#111111" stroke="#111111" stroke-width="0.3"/><text x="60.40" y="80.60" font-size="2.999" text-anchor="start" fill="#111111" font-weight="400">0</text><polygon points="61.70,84.60 64.70,84.60 63.20,82.20" fill="#111111" stroke="#111111" stroke-width="0.3"/><text x="65.60" y="84.60" font-size="2.999" text-anchor="start" fill="#111111" font-weight="400">1</text><text x="55.00" y="92.00" font-size="2.999" text-anchor="end" fill="#111111" font-weight="400">tryghost/koenig</text><rect x="93.10" y="87.40" width="2.60" height="2.20" fill="#111111" stroke="#111111" stroke-width="0.3"/><text x="96.80" y="89.60" font-size="2.999" text-anchor="start" fill="#111111" font-weight="400">7</text><polygon points="66.90,93.60 69.90,93.60 68.40,91.20" fill="#111111" stroke="#111111" stroke-width="0.3"/><text x="70.80" y="93.60" font-size="2.999" text-anchor="start" fill="#111111" font-weight="400">2</text><text x="55.00" y="101.00" font-size="2.999" text-anchor="end" fill="#111111" font-weight="400">nasa/openmct</text><rect x="87.90" y="96.40" width="2.60" height="2.20" fill="#111111" stroke="#111111" stroke-width="0.3"/><text x="91.60" y="98.60" font-size="2.999" text-anchor="start" fill="#111111" font-weight="400">6</text><polygon points="87.70,102.60 90.70,102.60 89.20,100.20" fill="#111111" stroke="#111111" stroke-width="0.3"/><text x="91.60" y="102.60" font-size="2.999" text-anchor="start" fill="#111111" font-weight="400">6</text><text x="55.00" y="110.00" font-size="2.999" text-anchor="end" fill="#111111" font-weight="400">microsoft/playwright</text><rect x="61.90" y="105.40" width="2.60" height="2.20" fill="#111111" stroke="#111111" stroke-width="0.3"/><text x="65.60" y="107.60" font-size="2.999" text-anchor="start" fill="#111111" font-weight="400">1</text><polygon points="129.30,111.60 132.30,111.60 130.80,109.20" fill="#111111" stroke="#111111" stroke-width="0.3"/><text x="133.20" y="111.60" font-size="2.999" text-anchor="start" fill="#111111" font-weight="400">14</text><text x="80.00" y="122.50" font-size="3.704" text-anchor="middle" fill="#111111" font-weight="400">图 5-7　四个真实项目的池量、等额抽样与少数类命中</text><text x="80.00" y="126.70" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">数据：out/reprobreak_e2e.json → rows[].repo / .rule / .llm（414 条全池，非 40 条复核样本）。</text><text x="80.00" y="129.90" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">少数类命中（自上而下）：规则臂 0/7/6/1，LLM 臂 1/2/6/14；每仓抽样 10 条为分母。</text><text x="80.00" y="133.10" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">每仓等额 10 条既不按池比例、也不按过时类型分层：抽样比 4.1%–22.2%，小仓约为大仓的 5.4 倍。</text><text x="80.00" y="136.30" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">microsoft/playwright 的 LLM 臂 14/45 = 31.1%，是 LLM 增益的主要来源；</text><text x="80.00" y="139.50" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">ghiscoding/angular-slickgrid 两臂合计仅 1/245，小仓单条命中的权重远高于大仓。</text></g>
</svg>

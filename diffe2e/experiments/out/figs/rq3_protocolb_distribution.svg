e" fill="#555555" font-weight="400">稳定性字段：out/repeats/variance_report.json → conditions.masked.families.rq3.stability。</text><text x="75.00" y="109.20" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">数据：out/annotator1_masked.json → rq3.rows[rb033].label = STRUCTURAL_ONLY。</text></g>

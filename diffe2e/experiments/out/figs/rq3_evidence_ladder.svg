<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="160.0mm" height="136.0mm" viewBox="0 0 160.0 136.0" version="1.1">
<title>图 5-6 RQ3 证据阶梯：9604 条断裂到端到端修复率</title>
<rect x="0" y="0" width="160.0" height="136.0" fill="#ffffff"/>
<g font-family="Noto Sans CJK SC, Source Han Sans SC, PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><defs>
<pattern id="hatch" width="1.4" height="1.4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<line x1="0" y1="0" x2="0" y2="1.4" stroke="#333333" stroke-width="0.3"/>
</pattern>
<pattern id="hatchL" width="2.2" height="2.2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<line x1="0" y1="0" x2="0" y2="2.2" stroke="#666666" stroke-width="0.2"/>
</pattern>
<pattern id="dotf" width="1.5" height="1.5" patternUnits="userSpaceOnUse">
<circle cx="0.55" cy="0.55" r="0.26" fill="#333333"/>
</pattern>
</defs><text x="50.00" y="21.00" font-size="3.351" text-anchor="end" fill="#111111" font-weight="400">① 执行验证断裂</text><text x="50.00" y="24.80" font-size="2.822" text-anchor="end" fill="#555555" font-weight="400">n = 9604（全部）</text><rect x="54.00" y="16.00" width="96.00" height="9.00" fill="#111111" stroke="#111111" stroke-width="0.25"/><text x="148.40" y="21.90" font-size="3.175" text-anchor="end" fill="#FFFFFF" font-weight="400">9604/9604 = 100%</text><text x="50.00" y="43.00" font-size="3.351" text-anchor="end" fill="#111111" font-weight="400">② 语义可达（addressable）</text><text x="50.00" y="46.80" font-size="2.822" text-anchor="end" fill="#555555" font-weight="400">n = 9604</text><text x="50.00" y="50.20" font-size="2.822" text-anchor="end" fill="#555555" font-weight="400">Playwright 17.4%｜Cypress 6.9%</text><rect x="54.00" y="38.00" width="11.71" height="9.00" fill="#111111" stroke="#111111" stroke-width="0.25"/><text x="67.71" y="43.90" font-size="3.175" text-anchor="start" fill="#111111" font-weight="400">1172/9604 = 12.2%</text><text x="50.00" y="65.00" font-size="3.351" text-anchor="end" fill="#111111" font-weight="400">③ 已知信号下的改写上界</text><text x="50.00" y="68.80" font-size="2.822" text-anchor="end" fill="#555555" font-weight="400">n = 578</text><rect x="54.00" y="60.00" width="95.34" height="9.00" fill="url(#hatchL)" stroke="#111111" stroke-width="0.25"/><text x="147.74" y="65.90" font-size="3.175" text-anchor="end" fill="#111111" font-weight="400">574/578 = 99.3%</text><line x1="8.00" y1="75.50" x2="152.00" y2="75.50" stroke="#555555" stroke-width="0.3" stroke-dasharray="1.4 1.0"/><text x="80.00" y="79.40" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">口径改变：④ 为另一样本基，与 ③ 并列而非包含</text><text x="50.00" y="92.00" font-size="3.351" text-anchor="end" fill="#111111" font-weight="400">④ 端到端修复（无泄漏）</text><text x="50.00" y="95.80" font-size="2.822" text-anchor="end" fill="#555555" font-weight="400">n = 414</text><rect x="54.00" y="87.00" width="3.25" height="7.00" fill="#111111" stroke="#111111" stroke-width="0.25"/><text x="62.00" y="91.90" font-size="3.175" text-anchor="start" fill="#111111" font-weight="400">规则臂 14/414 = 3.38%</text><rect x="54.00" y="98.00" width="5.33" height="7.00" fill="url(#dotf)" stroke="#111111" stroke-width="0.25"/><text x="62.00" y="102.90" font-size="3.175" text-anchor="start" fill="#111111" font-weight="400">LLM 臂 23/414 = 5.56%</text><text x="80.00" y="111.00" font-size="3.175" text-anchor="middle" fill="#111111" font-weight="400">改写机制在已知信号下已达 99.3%，端到端仅 3.38%–5.56%</text><text x="80.00" y="115.20" font-size="3.175" text-anchor="middle" fill="#111111" font-weight="400">⇒ 瓶颈在“由应用 diff 自行还原 old→new 信号”，不在改写机制</text><text x="80.00" y="123.00" font-size="3.704" text-anchor="middle" fill="#111111" font-weight="400">图 5-6　RQ3 从 9604 条断裂到端到端修复率的证据阶梯</text><text x="80.00" y="127.20" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">数据：out/reprobreak.json → n（①）、addressable.yes/ratio、by_framework（②）、</text><text x="80.00" y="130.20" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">repair_rewriter.{n,exact_match,rate}（③）；out/reprobreak_e2e.json → arms.rule.{ok,n}、</text><text x="80.00" y="133.20" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">arms.llm.{ok,n}（④）；各级 n 见左栏，百分比按各自分母计算。</text></g>
</svg>

<pattern id="dotf" width="1.5" height="1.5" patternUnits="userSpaceOnUse">
<circle cx="0.55" cy="0.55" r="0.26" fill="#333333"/>
</pattern>
</defs><text x="4.00" y="8.00" font-size="3.175" text-anchor="start" fill="#111111" font-weight="400">（a）映射器 M：带类型的二部图</text><text x="4.00" y="13.00" font-size="2.822" text-anchor="start" fill="#555555" font-weight="400">测试 T ↔ 实体 E（五类）</text><rect x="4" y="28" width="44" height="17" rx="2.2" fill="none" stroke="#111111" stroke-width="0.45"/><text x="6.50" y="34.40" font-size="2.999" text-anchor="start" fill="#111111" font-weight="400">cart.spec.ts ›</text><text x="6.50" y="39.00" font-size="2.822" text-anchor="start" fill="#111111" font-weight="400">cart adds an item and</text><text x="6.50" y="43.00" font-size="2.822" text-anchor="start" fill="#111111" font-weight="400">updates count and total</text><text x="4.00" y="51.00" font-size="2.822" text-anchor="start" fill="#555555" font-weight="400">用例 id ＝「spec 文件 › 用例标题」</text><text x="62.00" y="16.20" font-size="2.822" text-anchor="start" fill="#555555" font-weight="400">E_file（文件）</text><rect x="62.00" y="18.00" width="36.00" height="9.00" fill="none" stroke="#111111" stroke-width="0.3"/><text x="80.00" y="24.10" font-size="2.999" text-anchor="middle" fill="#111111" font-weight="400">src/cart.js</text><text x="62.00" y="30.20" font-size="2.822" text-anchor="start" fill="#555555" font-weight="400">E_func（函数）</text><rect x="62" y="32.0" width="36" height="9" rx="2.4" fill="none" stroke="#111111" stroke-width="0.3"/><text x="80.00" y="38.10" font-size="2.999" text-anchor="middle" fill="#111111" font-weight="400">render()</text><text x="62.00" y="44.20" font-size="2.822" text-anchor="start" fill="#555555" font-weight="400">E_route（路由）</text><polygon points="64.60,46.00 98.00,46.00 95.40,55.00 62.00,55.00" fill="none" stroke="#111111" stroke-width="0.3"/><text x="80.00" y="52.10" font-size="2.999" text-anchor="middle" fill="#111111" font-weight="400">/cart</text><text x="62.00" y="58.20" font-size="2.822" text-anchor="start" fill="#555555" font-weight="400">E_comp（组件）</text><polygon points="65.00,60.00 95.00,60.00 98.00,64.50 95.00,69.00 65.00,69.00 62.00,64.50" fill="none" stroke="#111111" stroke-width="0.3"/><text x="80.00" y="66.10" font-size="2.999" text-anchor="middle" fill="#111111" font-weight="400">cart 页面组件</text><text x="62.00" y="72.20" font-size="2.822" text-anchor="start" fill="#555555" font-weight="400">E_ui（语义节点）</text><rect x="62.00" y="74.00" width="36.00" height="9.00" fill="url(#hatchL)" stroke="#111111" stroke-width="0.3"/><rect x="63.30" y="75.30" width="33.40" height="6.40" fill="none" stroke="#111111" stroke-width="0.3"/><text x="80.00" y="80.10" font-size="2.999" text-anchor="middle" fill="#111111" font-weight="400">{testId, cart-add}</text><line x1="48.00" y1="36.50" x2="62.00" y2="22.50" stroke="#111111" stroke-width="0.35"/><line x1="48.00" y1="36.50" x2="62.00" y2="36.50" stroke="#111111" stroke-width="0.35"/><line x1="48.00" y1="36.50" x2="62.00" y2="50.50" stroke="#111111" stroke-width="0.35"/><line x1="48.00" y1="36.50" x2="62.00" y2="64.50" stroke="#111111" stroke-width="0.35"/><line x1="48.00" y1="36.50" x2="62.00" y2="77.20" stroke="#111111" stroke-width="0.35"/><line x1="48.00" y1="36.50" x2="62.00" y2="80.40" stroke="#111111" stroke-width="0.35" stroke-dasharray="1.6 1.1"/><text x="104.00" y="8.00" font-size="3.175" text-anchor="start" fill="#111111" font-weight="400">（b）增量更新（c08 一次过渡）</text><rect x="104.00" y="14.00" width="52.00" height="8.00" fill="none" stroke="#111111" stroke-width="0.3"/><text x="130.00" y="19.30" font-size="2.999" text-anchor="middle" fill="#111111" font-weight="400">Δ = changedEntities(diff)</text><rect x="104.00" y="26.00" width="52.00" height="16.00" fill="none" stroke="#111111" stroke-width="0.3"/><text x="105.80" y="30.20" font-size="2.822" text-anchor="start" fill="#555555" font-weight="400">entityIndex（实体→测试）</text><text x="105.80" y="35.40" font-size="2.822" text-anchor="start" fill="#111111" font-weight="400">src/cart.js → cart.spec.ts</text><text x="105.80" y="40.20" font-size="2.822" text-anchor="start" fill="#111111" font-weight="400">testId=cart-add → cart.spec.ts</text><rect x="104.00" y="46.00" width="52.00" height="11.00" fill="none" stroke="#111111" stroke-width="0.3"/><text x="130.00" y="51.40" font-size="2.999" text-anchor="middle" fill="#111111" font-weight="400">T_touch = ∪ entityIndex[e]</text><text x="130.00" y="55.40" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">= { cart.spec.ts }</text><rect x="104.00" y="61.00" width="52.00" height="12.00" fill="none" stroke="#111111" stroke-width="0.3"/><text x="130.00" y="66.20" font-size="2.999" text-anchor="middle" fill="#111111" font-weight="400">重插桩 T_touch 中的用例</text><text x="130.00" y="70.40" font-size="2.999" text-anchor="middle" fill="#111111" font-weight="400">重抽 changedFiles 的 UI 边</text><rect x="104.00" y="77.00" width="52.00" height="9.00" fill="url(#hatchL)" stroke="#111111" stroke-width="0.3"/><text x="130.00" y="82.70" font-size="2.999" text-anchor="middle" fill="#111111" font-weight="400">其余边从 M_old 复用 → M_new</text><line x1="4.00" y1="90.00" x2="14.00" y2="90.00" stroke="#111111" stroke-width="0.35"/><text x="16.00" y="91.20" font-size="2.822" text-anchor="start" fill="#111111" font-weight="400">dynamic（插桩证据）</text><line x1="50.00" y1="90.00" x2="60.00" y2="90.00" stroke="#111111" stroke-width="0.35" stroke-dasharray="1.6 1.1"/><text x="62.00" y="91.20" font-size="2.822" text-anchor="start" fill="#111111" font-weight="400">ui（定位器/文本证据）</text><line x1="104.00" y1="90.00" x2="114.00" y2="90.00" stroke="#555555" stroke-width="0.35"/><text x="116.00" y="91.20" font-size="2.822" text-anchor="start" fill="#555555" font-weight="400">复用自 M_old</text><text x="4.00" y="98.50" font-size="2.999" text-anchor="start" fill="#111111" font-weight="400">本次更新：changed_files = 1（src/cart.js）｜full_suite = 6｜受影响与选中均为 1 条｜UI 信号 1 个（cart-add）</text><text x="4.00" y="103.50" font-size="2.822" text-anchor="start" fill="#555555" font-weight="400">只对 1 条用例重插桩、只对 1 个文件重抽 UI 边；其余 5 条用例的边不重建，复用是 C_update ≪ C_build 的来源（§3.2）。</text><text x="80.00" y="110.50" font-size="3.704" text-anchor="middle" fill="#111111" font-weight="400">图 3-3　测试↔代码映射器与增量更新</text><text x="80.00" y="114.70" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">结构示意。数字取 out/rq1_dataset.jsonl 中 tag=c08 的 changed_files、full_suite、</text><text x="80.00" y="118.00" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">selected_count 与 ui_signals，无手填值。</text><text x="80.00" y="121.30" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">边类型依 §3.2：实线＝dynamic，虚线＝ui；浅灰＝从 M_old 复用的边。</text><text x="80.00" y="124.60" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">entityIndex 为图内概念标注（反向索引），非第三类节点；代码侧无同名变量。反查实际由</text><text x="80.00" y="127.90" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">selector.mjs 的 selectByCoverage（覆盖边）与 selectByUiLocator（UI 锚点）线性扫描边集完成；</text><text x="80.00" y="131.20" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">其余 5 条用例的边同构，图（a）只画 c08 这一条。</text></g>
</svg>

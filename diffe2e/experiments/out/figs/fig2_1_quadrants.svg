</defs><line x1="34.00" y1="87.00" x2="34.00" y2="22.00" stroke="#111111" stroke-width="0.4"/><polygon points="34.00,22.00 34.95,24.20 33.05,24.20" fill="#111111" stroke="#111111" stroke-width="0.3"/><line x1="34.00" y1="87.00" x2="155.00" y2="87.00" stroke="#111111" stroke-width="0.4"/><polygon points="155.00,87.00 152.80,87.95 152.80,86.05" fill="#111111" stroke="#111111" stroke-width="0.3"/><text x="95.00" y="94.50" font-size="2.999" text-anchor="middle" fill="#111111" font-weight="400">维度 A：代码变更感知程度</text><text x="5.50" y="56.00" font-size="2.999" text-anchor="middle" fill="#111111" font-weight="400" transform="rotate(-90 5.50 56.00)">维度 B：测试层级与上下文</text><text x="53.50" y="16.50" font-size="2.999" text-anchor="middle" fill="#111111" font-weight="400">A0 无 diff</text><text x="95.00" y="16.50" font-size="2.999" text-anchor="middle" fill="#111111" font-weight="400">A1 文件 / 方法级</text><text x="136.50" y="16.50" font-size="2.999" text-anchor="middle" fill="#111111" font-weight="400">A2 细粒度定向</text><text x="136.50" y="20.50" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">（diff 为核心）</text><text x="31.50" y="39.50" font-size="3.175" text-anchor="end" fill="#111111" font-weight="400">B1 全局 E2E</text><text x="31.50" y="71.50" font-size="3.175" text-anchor="end" fill="#111111" font-weight="400">B0 局部</text><rect x="34.00" y="24.00" width="39.00" height="30.00" fill="none" stroke="#111111" stroke-width="0.3"/><text x="53.50" y="35.60" font-size="3.175" text-anchor="middle" fill="#111111" font-weight="400">E2E 生成与修复</text><text x="53.50" y="40.80" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">不以 diff 为核心输入</text><text x="53.50" y="50.60" font-size="2.822" text-anchor="middle" fill="#111111" font-weight="400">[6][7][9][12][16]</text><rect x="75.50" y="24.00" width="39.00" height="30.00" fill="none" stroke="#111111" stroke-width="0.3"/><text x="95.00" y="35.60" font-size="3.175" text-anchor="middle" fill="#111111" font-weight="400">粗粒度覆盖迁移</text><text x="95.00" y="40.80" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">工程实践已有，未细化</text><text x="95.00" y="50.60" font-size="2.822" text-anchor="middle" fill="#111111" font-weight="400">（如文件级 E2E 选测）</text><rect x="117.00" y="24.00" width="39.00" height="30.00" fill="url(#hatchL)" stroke="#111111" stroke-width="0.9"/><text x="136.50" y="30.00" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">目标象限</text><text x="136.50" y="35.60" font-size="3.175" text-anchor="middle" fill="#111111" font-weight="400">本方法</text><text x="136.50" y="40.80" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">diff 约束的 E2E</text><text x="136.50" y="44.80" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">选择与缺口生成</text><text x="136.50" y="50.60" font-size="2.822" text-anchor="middle" fill="#111111" font-weight="400">第 3–5 章｜targeted set</text><rect x="34.00" y="56.00" width="39.00" height="30.00" fill="none" stroke="#111111" stroke-width="0.3"/><text x="53.50" y="67.60" font-size="3.175" text-anchor="middle" fill="#111111" font-weight="400">通用生成与修复</text><text x="53.50" y="72.80" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">与 diff 无关</text><text x="53.50" y="82.60" font-size="2.822" text-anchor="middle" fill="#111111" font-weight="400">[27][36]（仅举例）</text><rect x="75.50" y="56.00" width="39.00" height="30.00" fill="none" stroke="#111111" stroke-width="0.3"/><text x="95.00" y="67.60" font-size="3.175" text-anchor="middle" fill="#111111" font-weight="400">经典 RTS / 变更影响</text><text x="95.00" y="72.80" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">源码·依赖级选择（成熟）</text><text x="95.00" y="82.60" font-size="2.822" text-anchor="middle" fill="#111111" font-weight="400">[19][20][21][24][64]</text><rect x="117.00" y="56.00" width="39.00" height="30.00" fill="none" stroke="#111111" stroke-width="0.3"/><text x="136.50" y="67.60" font-size="3.175" text-anchor="middle" fill="#111111" font-weight="400">变更感知的单元/API</text><text x="136.50" y="72.80" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">生成与修复</text><text x="136.50" y="82.60" font-size="2.822" text-anchor="middle" fill="#111111" font-weight="400">[1][3][49][50][51][52]</text><text x="80.00" y="107.40" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">象限定义依 §2.1：A 维＝代码变更感知程度（A0 无／A1 文件·方法级／A2 diff 为核心），</text><text x="80.00" y="110.80" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">B 维＝测试层级与上下文（B0 局部／B1 全局 E2E）；斜纹＋粗框＝本文目标象限 (A2, B1)。</text><text x="80.00" y="114.20" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">(A1, B1) 与 (A0, B0) 的处置见 §2.1；格内编号为 §2.2 与 §2.5 的已有引用，未新增文献。</text><text x="80.00" y="117.60" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">编号为示例而非穷举，(A1, B0) 只列代表工作、未逐篇归位；本图不表示文献数量或效果强弱。</text></g>
</svg>

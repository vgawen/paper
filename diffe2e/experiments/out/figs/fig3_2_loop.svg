<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="160.0mm" height="118.0mm" viewBox="0 0 160.0 118.0" version="1.1">
<title>图 3-2 五步闭环</title>
<rect x="0" y="0" width="160.0" height="118.0" fill="#ffffff"/>
<g font-family="Noto Sans CJK SC, Source Han Sans SC, PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><defs>
<pattern id="hatch" width="1.4" height="1.4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<line x1="0" y1="0" x2="0" y2="1.4" stroke="#333333" stroke-width="0.3"/>
</pattern>
<pattern id="hatchL" width="2.2" height="2.2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<line x1="0" y1="0" x2="0" y2="2.2" stroke="#666666" stroke-width="0.2"/>
</pattern>
<pattern id="dotf" width="1.5" height="1.5" patternUnits="userSpaceOnUse">
<circle cx="0.55" cy="0.55" r="0.26" fill="#333333"/>
</pattern>
</defs><text x="4.00" y="7.00" font-size="2.999" text-anchor="start" fill="#111111" font-weight="400">输入：V_old（旧版本）、V_new（新版本）、diff（本次变更）、T（既有 E2E 测试集）</text><text x="4.00" y="12.00" font-size="2.822" text-anchor="start" fill="#555555" font-weight="400">分工：V_old → ① 建边；diff → ②③⑤；V_new → ④ 执行（评估用 oracle 另计）；T 在 ⑤ 被扩充</text><rect x="14.00" y="22.00" width="42.00" height="18.00" fill="none" stroke="#111111" stroke-width="0.45"/><text x="16.00" y="27.80" font-size="3.175" text-anchor="start" fill="#111111" font-weight="400">① 建立旧版本覆盖映射</text><text x="16.00" y="31.80" font-size="2.822" text-anchor="start" fill="#555555" font-weight="400">在 V_old 上逐条运行 T</text><text x="16.00" y="35.80" font-size="2.822" text-anchor="start" fill="#555555" font-weight="400">→ dynamic 边</text><rect x="59.00" y="22.00" width="42.00" height="18.00" fill="none" stroke="#111111" stroke-width="0.45"/><text x="61.00" y="27.80" font-size="3.175" text-anchor="start" fill="#111111" font-weight="400">② 分析本次代码变更</text><text x="61.00" y="31.80" font-size="2.822" text-anchor="start" fill="#555555" font-weight="400">diff → 变更实体 Δ</text><text x="61.00" y="35.80" font-size="2.822" text-anchor="start" fill="#555555" font-weight="400">Semantic UI Diff → ui 边</text><rect x="104.00" y="22.00" width="42.00" height="18.00" fill="none" stroke="#111111" stroke-width="0.45"/><text x="106.00" y="27.80" font-size="3.175" text-anchor="start" fill="#111111" font-weight="400">③ 选择相关 E2E 测试</text><text x="106.00" y="31.80" font-size="2.822" text-anchor="start" fill="#555555" font-weight="400">邻居查询 M</text><text x="106.00" y="35.80" font-size="2.822" text-anchor="start" fill="#555555" font-weight="400">Sel ＝ 覆盖臂 ∪ UI 臂</text><rect x="104.00" y="68.00" width="42.00" height="18.00" fill="none" stroke="#111111" stroke-width="0.45"/><text x="106.00" y="73.80" font-size="3.175" text-anchor="start" fill="#111111" font-weight="400">④ 运行、分诊与轻量修复</text><text x="106.00" y="77.80" font-size="2.822" text-anchor="start" fill="#555555" font-weight="400">在 V_new 上运行 Sel</text><text x="106.00" y="81.20" font-size="2.822" text-anchor="start" fill="#555555" font-weight="400">分诊：疑似回归／测试过时</text><text x="106.00" y="84.60" font-size="2.822" text-anchor="start" fill="#555555" font-weight="400">过时 → 轻量修复候选</text><rect x="59.00" y="68.00" width="42.00" height="18.00" fill="none" stroke="#111111" stroke-width="0.45"/><text x="61.00" y="73.80" font-size="3.175" text-anchor="start" fill="#111111" font-weight="400">⑤ 缺口分析与生成</text><text x="61.00" y="77.80" font-size="2.822" text-anchor="start" fill="#555555" font-weight="400">diff 未覆盖的新变化</text><text x="61.00" y="81.20" font-size="2.822" text-anchor="start" fill="#555555" font-weight="400">（已选／已修未触达部分）</text><text x="61.00" y="84.60" font-size="2.822" text-anchor="start" fill="#555555" font-weight="400">diff 约束生成 → 回填 T</text><rect x="14.00" y="44.00" width="132.00" height="6.00" fill="url(#hatchL)" stroke="#111111" stroke-width="0.35"/><text x="80.00" y="48.20" font-size="2.822" text-anchor="middle" fill="#111111" font-weight="400">M（持久化）：dynamic 边（① 建）＋ ui 边（② 建）；第 ③ 步做邻居查询</text><line x1="25.00" y1="40.00" x2="25.00" y2="41.90" stroke="#111111" stroke-width="0.4"/><polygon points="25.00,44.00 24.10,41.90 25.90,41.90" fill="#111111" stroke="#111111" stroke-width="0.3"/><line x1="112.00" y1="44.00" x2="112.00" y2="42.10" stroke="#111111" stroke-width="0.4"/><polygon points="112.00,40.00 112.90,42.10 111.10,42.10" fill="#111111" stroke="#111111" stroke-width="0.3"/><line x1="56.00" y1="31.00" x2="56.90" y2="31.00" stroke="#111111" stroke-width="0.4"/><polygon points="59.00,31.00 56.90,31.90 56.90,30.10" fill="#111111" stroke="#111111" stroke-width="0.3"/><line x1="101.00" y1="31.00" x2="101.90" y2="31.00" stroke="#111111" stroke-width="0.4"/><polygon points="104.00,31.00 101.90,31.90 101.90,30.10" fill="#111111" stroke="#111111" stroke-width="0.3"/><line x1="146.00" y1="31.00" x2="152.00" y2="31.00" stroke="#111111" stroke-width="0.4"/><line x1="152.00" y1="31.00" x2="152.00" y2="77.00" stroke="#111111" stroke-width="0.4"/><line x1="152.00" y1="77.00" x2="148.10" y2="77.00" stroke="#111111" stroke-width="0.4"/><polygon points="146.00,77.00 148.10,76.10 148.10,77.90" fill="#111111" stroke="#111111" stroke-width="0.3"/><line x1="104.00" y1="77.00" x2="103.10" y2="77.00" stroke="#111111" stroke-width="0.4"/><polygon points="101.00,77.00 103.10,76.10 103.10,77.90" fill="#111111" stroke="#111111" stroke-width="0.3"/><line x1="59.00" y1="77.00" x2="6.00" y2="77.00" stroke="#111111" stroke-width="0.6"/><line x1="6.00" y1="77.00" x2="6.00" y2="31.00" stroke="#111111" stroke-width="0.6"/><line x1="6.00" y1="31.00" x2="11.90" y2="31.00" stroke="#111111" stroke-width="0.6"/><polygon points="14.00,31.00 11.90,31.90 11.90,30.10" fill="#111111" stroke="#111111" stroke-width="0.3"/><text x="10.00" y="74.20" font-size="3.175" text-anchor="start" fill="#111111" font-weight="400">回填：新测试并入 T</text><text x="4.00" y="93.00" font-size="2.999" text-anchor="start" fill="#111111" font-weight="400">输出：targeted E2E set（④ 直接通过 ＋ 修复后通过）｜⑤ 的新增用例进入下一轮 T</text><text x="80.00" y="105.40" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">结构依 §3.1 五步；加粗回边＝第 ⑤ 步「回填」：生成通过的测试并入 T。</text><text x="80.00" y="108.80" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">下次提交在第 ① 步重新插桩建边、M 增量更新；T 由 ⑤ 扩充，跨提交二者共同演进。</text><text x="80.00" y="112.20" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">无泄漏纪律（§3.1）：选择只用 V_old 覆盖 + diff；V_new 全量执行仅构造评估 oracle，不参与选择，</text><text x="80.00" y="115.60" font-size="2.822" text-anchor="middle" fill="#555555" font-weight="400">也不进入修复输入与生成 prompt。示意，无实验数字；符号均已在 §3.1–§3.2 定义。</text></g>
</svg>

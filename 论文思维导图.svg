<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 692" width="720" height="692" role="img" aria-label="DiffE2E 论文结构思维导图：根节点连接七个章节与附录 A，第五章实验结果为焦点">
  <style>
    :root { color-scheme: light; }
    .bg { fill: #EFEFF2; }
